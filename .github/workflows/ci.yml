name: CI
on:
  push:
    branches: [main, feat/framegraph-dx12-0.1]
  pull_request:
permissions:
  contents: read
jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        shell: pwsh
        run: ./scripts/with-msvc.ps1 cmake --preset msvc-debug
      - name: Build Windows and Core
        shell: pwsh
        run: ./scripts/with-msvc.ps1 cmake --build --preset msvc-debug
      - name: Unit property canonical and shader smoke
        run: ctest --preset msvc-debug
      - name: Documentation links
        run: python tools/check_docs.py
  ubuntu-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [core-clang, core-gcc, core-sanitized]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - if: matrix.preset == 'core-clang'
        run: ./build/core-clang/framegraph_property --cases 1000
